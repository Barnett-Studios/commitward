version: "1"
checkpoints:
  - name: agent-instructions-self-mod
    summary: "Editing agent-governing instructions (CLAUDE.md / AGENTS.md / rules)"
    paths:
      - "(^|/)CLAUDE\\.md$"
      - "(^|/)AGENTS\\.md$"
      - "(^|/)rules/.*\\.md$"
  - name: gate-self-mod
    summary: "Modifying the gate itself — its registry, or the hook that invokes it"
    # NF2 (commitward#7). Without this, an agent can delete a checkpoint and use the
    # thing that checkpoint guarded in the SAME commit, and nothing fires: the deleted
    # checkpoint cannot fire, and no other checkpoint watches the registry.
    #
    # These are the paths *commitward itself* resolves — the default registry beside the
    # executable, the repo-local override (`main.rs`), and the installed commit-msg hook,
    # which is the quieter way to disable the gate. A registry pointed at by
    # COMMITWARD_REGISTRY cannot be matched by a static pattern; add its path here if you
    # use that variable.
    #
    # `(^|/)checkpoints\.yaml$` deliberately matches at any depth, so a registry vendored
    # under a subdirectory (or a test fixture registry) is guarded too. It fires — it does
    # not block; a deliberate change is acknowledged with a HITL-ACK line.
    paths:
      - "(^|/)checkpoints\\.yaml$"
      - "(^|/)\\.commitward/checkpoints\\.yaml$"
      - "(^|/)\\.git-hooks/commit-msg$"
      - "(^|/)\\.git/hooks/commit-msg$"
      - "(^|/)install-hook\\.sh$"
  - name: checkpoint-removed
    summary: "A checkpoint was removed from a registry (the gate was weakened)"
    # The semantic counterpart to gate-self-mod: that one fires on *touching* a registry,
    # this one on a checkpoint present at the base ref being absent now. Two independent
    # guards on the same act, so neither is a single point of failure.
    #
    # Requires the caller to supply base checkpoint names (`--base`, or the base registry
    # in a `gate` request). Without them this cannot fire — which is why an absent base is
    # now reported as a warning rather than passing silently (NF3).
    semantic: checkpoint_removed
  - name: destructive-ops
    summary: "Destructive git/filesystem command entering a committed file"
    content:
      # Force-push — fires on --force but NOT the safe --force-with-lease
      # variant (silenced 2026-07-16). The short -f form is position-anchored
      # via the trailing space in ([^\n]* )? so a benign branch name like
      # `my-feature-off` cannot trip it.
      - "git +push +[^\\n]*--force($|[^-])"
      - "git +push +([^\\n]* )?-[a-zA-Z]*f($|[^a-zA-Z])"
      # History rewrite — anchored to a `git ` (space or hyphen) prefix so a
      # bare textual mention in a comment / string / identifier does not fire.
      - "git[ -]filter-branch"
      - "git[ -]filter-repo"
      - "git +reset +--hard"
      - "checkout +--orphan"
      # Force-delete a branch — (?-i:-D) keeps this token case-SENSITIVE
      # (compile_ci forces case-insensitive) so the safe merged-only
      # `git branch -d` does NOT fire, only the force `-D`.
      - "git +branch +(?-i:-D)"
      - "update-ref +-d"
      - "reflog +expire"
      # NOTE: `git gc --prune` was removed 2026-07-16 — routine maintenance
      # (drops only unreachable objects), not work-destroying.
      # rm recursive+force — NARROWED to a DANGEROUS target so benign cleanup
      # (`rm -rf ./build`, `.terraform`, `node_modules`, `/tmp/x`) no longer
      # fires. Both a recursive AND a force flag must be present (so `rm -f x`
      # and `rm -r x` alone do not fire), THEN a whitespace-preceded dangerous
      # target somewhere in the argument list: root `/` or `/*`, home `~`, an
      # (unexpanded) variable/command-substitution `$`/backtick — the classic
      # `rm -rf $EMPTY/` footgun — or a system root dir. Scripts are STILL
      # checked; only the benign targets stop firing. The danger tail is
      # inlined per pattern (regex has no shared sub-expressions).
      # Combined flags (`rm -rf` / `-fr`):
      - "rm +-[a-zA-Z]*r[a-zA-Z]*f[^\\n]*[ \\t]+[\"]?(/([ \\t*]|$)|~([ \\t/]|$)|[$`]|/(etc|usr|var|bin|sbin|lib|lib64|boot|sys|proc|dev|root|opt|home|users|library|system)([ \\t/]|$))"
      - "rm +-[a-zA-Z]*f[a-zA-Z]*r[^\\n]*[ \\t]+[\"]?(/([ \\t*]|$)|~([ \\t/]|$)|[$`]|/(etc|usr|var|bin|sbin|lib|lib64|boot|sys|proc|dev|root|opt|home|users|library|system)([ \\t/]|$))"
      # Split short flags (rm -r -f / rm -f -r) and long flags (rm --recursive
      # --force), either order — same dangerous-target requirement:
      - "rm +[^\\n]*(-[a-zA-Z]*r|--recursive)[^\\n]*(-[a-zA-Z]*f|--force)[^\\n]*[ \\t]+[\"]?(/([ \\t*]|$)|~([ \\t/]|$)|[$`]|/(etc|usr|var|bin|sbin|lib|lib64|boot|sys|proc|dev|root|opt|home|users|library|system)([ \\t/]|$))"
      - "rm +[^\\n]*(-[a-zA-Z]*f|--force)[^\\n]*(-[a-zA-Z]*r|--recursive)[^\\n]*[ \\t]+[\"]?(/([ \\t*]|$)|~([ \\t/]|$)|[$`]|/(etc|usr|var|bin|sbin|lib|lib64|boot|sys|proc|dev|root|opt|home|users|library|system)([ \\t/]|$))"
      - "git +clean +-[a-zA-Z]*f"
    content_exempt_paths:
      - "(^|/)docs/"
      - "^checkpoints\\.yaml$"
      - "(^|/)\\.commitward/checkpoints\\.yaml$"
      - "(^|/)conformance/"
      - "(^|/)scripts/git-hooks/"
      # Exempt files that hold dangerous-command strings as test DATA (a
      # false-positive regression battery, fixtures) rather than executable
      # ops — add your own such paths here.
