name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable). No Dependabot
      # by choice; review these pins periodically, they do NOT auto-update.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Single source of truth for the toolchain: rust-toolchain.toml. This dtolnay
      # pin needs an explicit `toolchain` input and does not read the file itself.
      - name: resolve toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      # .github#20 review: the release workflow's GLIBC-floor gate had never
      # actually been shown to fail. Self-tests ci/glibc-floor.sh against two
      # canned readelf dumps (no binary, no real readelf invocation needed —
      # the script falls back to reading the fixture as already-captured text)
      # so a regression in the gate itself is caught here, in the fast path,
      # not discovered the day a release silently ships over the floor.
      - name: self-test the GLIBC floor gate
        run: |
          set -e
          ci/glibc-floor.sh ci/fixtures/readelf-2.28.txt 2.28
          if ci/glibc-floor.sh ci/fixtures/readelf-2.39-pidfd.txt 2.28; then
            echo "::error::glibc-floor.sh should have failed on the 2.39 fixture but exited 0"
            exit 1
          fi
          echo "glibc-floor.sh correctly failed on the 2.39 fixture"
      - name: hook installer test
        run: bash tests/install_hook_test.sh
      - name: vendored registry matches shipped default
        # The self-contained test corpus snapshot must not drift from the shipped
        # baseline the CLI actually loads.
        run: diff checkpoints.yaml tests/corpus/promise/checkpoints.yaml
  docker:
    name: docker-build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: build image
        # Retry once — docker layer pulls are network-bound.
        run: docker build -t commitward:ci . || docker build -t commitward:ci .
      - name: smoke
        run: docker run --rm commitward:ci --help | grep -qi usage
      - name: smoke gate (envelope subcommand, network-free)
        run: |
          # A path checkpoint fires on a CLAUDE.md change with no HITL-ACK → exit_class 2 in the body
          # (the process still exits 0 — the decision is data, not the exit code).
          req='{"name_status":"M\tCLAUDE.md","commit_msg":"docs: x","global_registry_yaml":"version: \"1\"\ncheckpoints:\n  - name: cm\n    summary: s\n    paths:\n      - CLAUDE\n"}'
          out="$(printf '%s' "$req" | docker run --rm -i --network none commitward:ci gate)"
          echo "$out"
          echo "$out" | grep -q '"status":"ok"'
          echo "$out" | grep -q '"exit_class":2'
          # A malformed request must surface the error sentinel, not a false clean pass.
          err="$(echo 'nope' | docker run --rm -i --network none commitward:ci gate || true)"
          echo "$err" | grep -q '"status":"error"'
      - name: smoke the DOCUMENTED path (mounted repo, git-reading CLI)
        # The gap this closes: every check above uses `gate`, which takes the diff and the
        # registry on stdin and so needs neither git nor a baked registry. The published
        # image had neither, and its documented form exited 0 with empty stdout for every
        # diff there has ever been (commitward#13).
        run: bash tests/container_documented_path.sh commitward:ci
      - name: build and smoke the image CI actually publishes
        # release.yml builds Dockerfile.dist, not Dockerfile — and until now nothing here
        # built it at all, which is how the two runtime contracts diverged unnoticed.
        # Staging a binary out of the image just built reproduces the release flow's COPY
        # without needing the release toolchain.
        run: |
          arch="$(docker version --format '{{.Server.Arch}}')"
          id="$(docker create commitward:ci)"
          mkdir -p "dist/linux/$arch"
          docker cp "$id:/usr/local/bin/commitward" "dist/linux/$arch/commitward"
          docker rm "$id" > /dev/null
          docker build -f Dockerfile.dist -t commitward:dist . || docker build -f Dockerfile.dist -t commitward:dist .
          bash tests/container_documented_path.sh commitward:dist
